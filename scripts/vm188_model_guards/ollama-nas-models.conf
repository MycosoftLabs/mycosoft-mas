[Unit]
After=mnt-mycosoft-nas.mount
ConditionPathIsMountPoint=/mnt/mycosoft-nas

[Service]
Environment=OLLAMA_MODELS=/mnt/mycosoft-nas/models/myca/ollama
Environment=HF_HOME=/mnt/mycosoft-nas/models/myca/huggingface
Environment=TRANSFORMERS_CACHE=/mnt/mycosoft-nas/models/myca/huggingface
Environment=HUGGINGFACE_HUB_CACHE=/mnt/mycosoft-nas/models/myca/huggingface
# NLM is a separate scientific tree. Do not inherit OLLAMA_HOST into /api/nlm.
# Vendor ExecStart=/usr/local/bin/ollama serve uses the fail-closed wrapper.
ExecStartPre=/usr/local/sbin/mycosoft-require-nas-models.sh
