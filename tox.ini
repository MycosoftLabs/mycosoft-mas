[tox]
envlist = py311, py312
isolated_build = True
skip_missing_interpreters = True

[testenv]
setenv =
    SKIP_INTEGRATION = 1
passenv =
    SKIP_INTEGRATION
deps =
    poetry
commands =
    poetry install --with dev
    poetry run pytest {posargs:tests} --ignore=tests/test_reciprocal_turing_agent.py --ignore=tests/test_voice_memory_bridge.py --ignore=tests/test_earth2_integration.py --ignore=tests/test_earth_search.py --ignore=tests/test_full_integration_apis.py --ignore=tests/test_static_system_integration.py
    poetry run pipdeptree --warn fail
    poetry run pip-audit

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --cov=mycosoft_mas --cov-report=term-missing

[testenv:lint]
deps =
    black
    isort
    flake8
    mypy
commands =
    black --check mycosoft_mas tests
    isort --check-only mycosoft_mas tests
    flake8 mycosoft_mas tests
    mypy mycosoft_mas

[testenv:docs]
deps =
    sphinx
    sphinx-rtd-theme
    sphinx-autodoc-typehints
commands =
    sphinx-build -b html docs docs/_build/html 