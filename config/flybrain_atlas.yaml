derived:
  p9_left_downstream:
    downstream_of:
    - p9_left
    hops: 1
    min_weight: 5
    exclude:
    - p9_right
    role: motor
    description: Direct postsynaptic partners of left P9 (weight >= 5). Turn readout, left branch.
  p9_right_downstream:
    downstream_of:
    - p9_right
    hops: 1
    min_weight: 5
    exclude:
    - p9_left
    role: motor
    description: Direct postsynaptic partners of right P9 (weight >= 5). Turn readout, right branch.
  p9_shared_downstream:
    downstream_of:
    - p9_left
    - p9_right
    hops: 1
    min_weight: 5
    intersection: true
    role: motor
    description: Neurons postsynaptic to both P9s. Forward-drive readout.
  sugar_downstream:
    downstream_of:
    - sugar_grn
    hops: 1
    min_weight: 5
    role: interneuron
    description: Direct postsynaptic partners of sugar GRNs (feeding circuit second order).
sensorimotor:
  note: Demonstration mapping. Which biological groups get external drive and which are read out is a configuration choice, not a biological claim.
  inputs:
    forward:
    - p9_left
    - p9_right
    left:
    - p9_left
    right:
    - p9_right
    attract:
    - sugar_grn
  readouts:
    forward:
    - p9_shared_downstream
    turn_left:
    - p9_left_downstream
    turn_right:
    - p9_right_downstream
    feeding:
    - sugar_downstream
